<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>⚙️</text></svg>"
    />

    <!-- 主题样式 -->
    <link rel="stylesheet" href="/assets/web/styles/theme.css" />
    <link rel="stylesheet" href="/assets/web/styles/layout.css" />
    <link rel="stylesheet" href="/assets/web/styles/basic.css" />
    <link rel="stylesheet" href="/assets/web/styles/settings-modal.css" />

    <!-- GitHub Markdown 样式 -->
    <link
      rel="stylesheet"
      href="https://fastly.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown-light.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="stylesheet"
      href="https://fastly.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown-dark.css"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Highlight.js 代码高亮 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
      media="(prefers-color-scheme: dark)"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

    <!-- KaTeX 数学公式 -->
    <link
      rel="stylesheet"
      href="https://fastly.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css"
      integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://fastly.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"
      integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs"
      crossorigin="anonymous"
    ></script>

    <!-- Markdown-it -->
    <script
      src="https://fastly.jsdelivr.net/npm/markdown-it@14.3.0/dist/markdown-it.min.js"
      integrity="sha256-cP4XvQbH+oGfA6HtEJV5BDGBA2JBmIRdyJOzCb9JXig="
      crossorigin="anonymous"
    ></script>
    <script src="https://fastly.jsdelivr.net/npm/markdown-it-katex@2.0.3/index.min.js"></script>

    <!-- 自定义脚本 -->
    <script src="/assets/web/scripts/theme.js"></script>
    <script src="/assets/web/scripts/file-browser.js"></script>

    <title>RouterFirmware - 文件浏览器</title>
  </head>
  <body>
    <div class="container">
      <h1>RouterFirmware 文件浏览器</h1>
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="搜索文件或目录..."
        />
        <div class="search-buttons">
          <button id="searchCurrentBtn">🔎 搜索当前目录</button>
          <button id="searchGlobalBtn">🔍 全局搜索</button>
          <button id="refreshBtn" title="强制刷新数据">🔄 刷新数据</button>
        </div>
      </div>
      <div id="searchInfo" class="search-info"></div>
      <hr />
      <div id="content">
        <div class="loading">正在加载...</div>
      </div>
      <div
        id="readme"
        class="readme-container markdown-body"
        style="display: none"
      ></div>
    </div>
  </body>
</html>
